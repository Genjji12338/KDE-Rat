# Build recipe for F-Droid (goes to fdroiddata as metadata/dev.tunnelrat.yml).
# Test it before submitting: `fdroid build -v -l dev.tunnelrat` in an fdroiddata checkout.
Categories:
  - Connectivity
  - System
License: GPL-3.0-or-later
SourceCode: https://github.com/I232826/tunnelrat
IssueTracker: https://github.com/I232826/tunnelrat/issues
Changelog: https://github.com/I232826/tunnelrat/tags

AutoName: Tunnelrat

RepoType: git
Repo: https://github.com/I232826/tunnelrat.git

Builds:
  - versionName: 0.2.0
    versionCode: 2
    commit: v0.2.0
    subdir: android/app
    sudo:
      # The build asks Gradle for a Java 21 toolchain; give it Debian's.
      - apt-get update
      - apt-get install -y openjdk-21-jdk-headless
      - update-java-alternatives -a
    gradle:
      - yes

# Reproducible (verified with fdroid build + apksigcopier for 0.2.0): F-Droid
# ships the release APK from GitHub with the developer's signature, so it is
# interchangeable with the project's own APK.
AllowedAPKSigningKeys: de05b2d9af7639f1611337bd7ccb255d5c58166298265d2bd1d643fb90ea4b6e
Binaries: https://github.com/I232826/tunnelrat/releases/download/v%v/tunnelrat-%v.apk

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 0.2.0
CurrentVersionCode: 2
